name: API Patas em Casa

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patas
          POSTGRES_PASSWORD: patas
          POSTGRES_DB: patas_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://patas:patas@localhost:5432/patas_teste?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high
      - name: Verificação de sintaxe
        run: find src scripts server.js -name '*.js' -exec node --check {} +
      - name: Testes unitários e HTTP
        run: npm test
      - name: Migrations no banco de teste
        run: npm run db:migrate
      - name: Testes de integração
        run: npm run test:integration
      - name: Imagem Docker
        run: docker build -t patas-em-casa-api .
